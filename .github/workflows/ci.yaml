on:
  push:
    branches:
    - master
  pull_request:
name: ci
permissions:
  contents: read
jobs:
  units:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [8, 11]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1.4.5
      with:
        java-version: ${{matrix.java}}
    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d' --utc)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: mvn-cache
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-unified-${{ steps.date.outputs.date }}
    - run: java -version
    # The http connection settings avoid Maven's HTTP connection reset in GitHub Actions
    # https://github.com/actions/virtual-environments/issues/1499#issuecomment-689467080
    - run: |
        ./mvnw -B -e -ntp install \
            -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false \
            -Dmaven.wagon.httpconnectionManager.ttlSeconds=120
    - run: cd gradle-plugin && ./gradlew build

